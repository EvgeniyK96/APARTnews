{% extends "base.html" %}

{% block title %}Регистрация · APARTnews{% endblock %}

{% block content %}
<div class="auth">
    <div class="auth__card">
        <h1 class="auth__title">Регистрация</h1>
        <form method="post" class="auth__form">
            {% csrf_token %}
            {% for field in form %}
                <label class="field">
                    <span class="field__label">{{ field.label }}</span>
                    {{ field }}
                    {% if field.help_text %}<span class="field__help">{{ field.help_text|safe }}</span>{% endif %}
                    {% if field.errors %}<span class="field-error">{{ field.errors }}</span>{% endif %}
                </label>
            {% endfor %}
            <button type="submit" class="btn btn--solid btn--block">Создать аккаунт</button>
        </form>
        <p class="auth__alt">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
    </div>
</div>
{% endblock %}
