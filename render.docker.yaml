# Render Blueprint — вариант деплоя через Docker.
# Чтобы использовать его вместо нативного (render.yaml), переименуй этот файл
# в render.yaml (Render читает только render.yaml) и импортируй в дашборде:
# New → Blueprint → выбрать репозиторий.
#
# Отличие от нативного варианта: сборка идёт по Dockerfile, а миграции и
# collectstatic выполняет docker-entrypoint.sh при старте контейнера.

databases:
  - name: apartnews-db
    plan: free
    databaseName: apartnews
    user: apartnews

services:
  - type: web
    name: apartnews
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    envVars:
      # Render сгенерирует случайный секретный ключ сам.
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Строка подключения из базы выше.
      - key: DATABASE_URL
        fromDatabase:
          name: apartnews-db
          property: connectionString
      # Ключ GNews нужно вписать вручную в дашборде (sync: false — не в git).
      - key: GNEWS_API_KEY
        sync: false
      - key: GNEWS_LANG
        value: "ru"
      - key: GNEWS_CACHE_TTL
        value: "1800"
      # Число воркеров gunicorn.
      - key: WEB_CONCURRENCY
        value: "4"
      - key: LANGUAGE_CODE
        value: "ru"
      - key: TIME_ZONE
        value: "Asia/Almaty"
