[project]
name = "apartnews"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django",
    "djangorestframework",
    "djangorestframework-simplejwt",
    "djoser",
    "drf-yasg",
    "django-environ",
    "django-jazzmin",
    "Pillow",
    "psycopg2-binary",
    "trafilatura",
    "gunicorn",
    "whitenoise",
]
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501", "F401"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
