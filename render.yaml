# Render Blueprint (https://render.com/docs/blueprint-spec)
# Разворачивает веб-сервис APARTnews + базу PostgreSQL.
# Импорт: в дашборде Render → New → Blueprint → выбрать этот репозиторий.

databases:
  - name: apartnews-db
    plan: free
    databaseName: apartnews
    user: apartnews

services:
  - type: web
    name: apartnews
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      # Версия Python (совпадает с локальной разработкой).
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Render сгенерирует случайный секретный ключ сам.
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Подключение к БД выше — Render подставит строку подключения.
      - key: DATABASE_URL
        fromDatabase:
          name: apartnews-db
          property: connectionString
      # Ключ GNews нужно вписать вручную в дашборде (sync: false — не в git).
      - key: GNEWS_API_KEY
        sync: false
      - key: GNEWS_LANG
        value: "ru"
      - key: GNEWS_CACHE_TTL
        value: "1800"
      # Число воркеров gunicorn.
      - key: WEB_CONCURRENCY
        value: "4"
      - key: LANGUAGE_CODE
        value: "ru"
      - key: TIME_ZONE
        value: "Asia/Almaty"
