# Render Blueprint (https://render.com/docs/blueprint-spec)
# Разворачивает веб-сервис APARTnews + базу PostgreSQL.
# Импорт: в дашборде Render → New → Blueprint → выбрать этот репозиторий.

databases:
  - name: apartnews-db
    plan: free
    databaseName: apartnews
    user: apartnews

services:
  - type: web
    name: apartnews
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "./build.sh"
    # Сначала миграции (БД уже доступна), затем gunicorn.
    # --workers 1 --threads: один процесс => общий LocMemCache между запросами,
    # иначе кэш статей у каждого воркера свой и страница статьи «теряет» новость.
    startCommand: "python manage.py migrate --no-input && gunicorn core.wsgi:application --workers 1 --threads 4 --bind 0.0.0.0:$PORT"
    envVars:
      # Версия Python (совпадает с локальной разработкой).
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Render сгенерирует случайный секретный ключ сам.
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Подключение к БД выше — Render подставит строку подключения.
      - key: DATABASE_URL
        fromDatabase:
          name: apartnews-db
          property: connectionString
      # Ключ GNews нужно вписать вручную в дашборде (sync: false — не в git).
      - key: GNEWS_API_KEY
        sync: false
      - key: GNEWS_LANG
        value: "ru"
      - key: GNEWS_CACHE_TTL
        value: "1800"
      - key: LANGUAGE_CODE
        value: "ru"
      - key: TIME_ZONE
        value: "Asia/Almaty"
